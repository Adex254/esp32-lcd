name: LCD Restore Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin

      - name: Setup ESP32 Core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32

      - name: Install Library
        run: |
          arduino-cli lib install "LiquidCrystal I2C"

      - name: Compile Sketch
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32doit-devkit-v1 \
            --output-dir build_out \
            ./lcd_test/lcd_test.ino

      - name: Merge to Single Binary
        run: |
          pip install esptool
          esptool.py --chip esp32 merge_bin -o adeoye_fixed.bin \
            --flash_mode keep \
            --flash_freq keep \
            --flash_size keep \
            0x1000 build_out/lcd_test.ino.bootloader.bin \
            0x8000 build_out/lcd_test.ino.partitions.bin \
            0x10000 build_out/lcd_test.ino.bin

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: fixed-binary
          path: adeoye_fixed.bin
