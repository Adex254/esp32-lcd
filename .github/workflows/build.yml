name: LCD Only Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Setup ESP32 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Library
        run: |
          # Locking to version 1.1.2 to ensure compatibility
          arduino-cli lib install "LiquidCrystal I2C"@1.1.2

      - name: Compile Sketch
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir build_out \
            ./lcd_test

      - name: Merge to Single Binary
        run: |
          pip install esptool
          esptool.py --chip esp32 merge_bin -o lcd_only.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 build_out/lcd_test.ino.bootloader.bin \
            0x8000 build_out/lcd_test.ino.partitions.bin \
            0x10000 build_out/lcd_test.ino.bin

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: lcd-test-bin
          path: lcd_only.bin
